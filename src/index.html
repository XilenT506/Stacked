<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STACKED Test Build</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff3e2; overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  canvas { display: block; }
  #coathud { position: fixed; left: 16px; bottom: 16px; color: #33201a; font-size: 15px; pointer-events: none; }
  #heads { display: flex; gap: 6px; margin-bottom: 6px; }
  .head { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #33201a; box-sizing: border-box; }
  .head.out { animation: bob 0.3s infinite alternate; opacity: 0.55; }
  .head.hid { opacity: 0.6; border-style: dashed; }
  @keyframes bob { to { transform: translateY(-5px); } }
  #wobblebox { width: 220px; height: 14px; border: 3px solid #33201a; border-radius: 8px; overflow: hidden; background: #fff; }
  #wobble { height: 100%; width: 0; }
  #hint { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #33201a; color: #fff3e2; padding: 6px 14px; border-radius: 14px; font-size: 16px; pointer-events: none; transition: opacity 0.2s; opacity: 0; }
  #announce { position: fixed; left: 50%; top: 66px; transform: translateX(-50%); max-width: 70%; background: #fff3e2; color: #33201a; border: 3px solid #33201a; padding: 8px 16px; border-radius: 14px; font-size: 18px; pointer-events: none; transition: opacity 0.4s; opacity: 0; text-align: center; }
  #heat, #closing { position: fixed; right: 16px; background: #fff3e2; color: #33201a; border: 3px solid #33201a; border-radius: 12px; padding: 4px 12px; font-size: 16px; pointer-events: none; display: none; }
  #heat { top: 52px; } #closing { top: 92px; }
  #closing.urgent { background: #c4553d; color: #fff3e2; animation: bob 0.5s infinite alternate; }
  .pip { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #33201a; margin: 0 1px -2px; }
  #gadgets { position: fixed; right: 16px; bottom: 16px; color: #33201a; font-size: 15px; pointer-events: none; display: none; }
  #gadgets .slot { background: #fff3e2; border: 3px solid #33201a; border-radius: 10px; padding: 3px 10px; margin-top: 4px; opacity: 0.7; }
  #gadgets .slot.cur { opacity: 1; background: #f4c542; }
  #gadgets .slot span { float: right; margin-left: 12px; }
  #gadgets .charge { height: 6px; background: #fff; border-radius: 3px; margin-top: 3px; } #gadgets .charge div { height: 100%; background: #c4553d; border-radius: 3px; }
  #blind { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s; background: radial-gradient(circle at 50% 50%, transparent 8%, #1a1208 45%); }
  #quota { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); width: 520px; color: #33201a; font-size: 14px; pointer-events: none; display: none; text-align: center; }
  #quota .qt span { opacity: 0.7; }
  #quota .qb { position: relative; display: flex; height: 14px; border: 3px solid #33201a; border-radius: 8px; background: #fff; overflow: hidden; margin-top: 3px; }
  #quota .qb div { background: #f4c542; } #quota .qb div.hand { background: #f9e3a0; }
  #results { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 420px; background: #fff3e2; color: #33201a; border: 4px solid #33201a; border-radius: 18px; padding: 16px 24px; display: none; font-size: 16px; }
  #results h2 { margin: 0 0 8px; } #results ul { list-style: none; padding: 0; margin: 0 0 8px; } #results li b { float: right; } #results s { opacity: 0.5; font-weight: normal; }
  #results .ok { color: #3f8a3a; font-weight: bold; } #results .no { color: #c4553d; font-weight: bold; } #results .small { font-size: 13px; opacity: 0.7; }
  #net { position: fixed; left: 16px; top: 150px; background: #fff3e2; border: 3px solid #33201a; border-radius: 12px; padding: 6px 10px; font-size: 13px; color: #33201a; max-width: 300px; }
  #net button { font: inherit; background: #f4c542; border: 2px solid #33201a; border-radius: 8px; padding: 2px 8px; cursor: pointer; }
  #net input { font: inherit; width: 64px; text-transform: uppercase; border: 2px solid #33201a; border-radius: 8px; padding: 2px 6px; }
  #net.on .row { display: none; }
  #net .kind { opacity: 0.6; }
  #hud { position: fixed; left: 16px; top: 64px; max-width: 30%; color: #33201a; font-size: 14px; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">STACKED, new build</div>
<div id="net"><b>Online</b> <span class="kind"></span><div class="row"><button class="host">Host</button> or <input maxlength="4" placeholder="CODE"> <button class="join">Join</button></div><div class="status"></div></div>
<div id="blind"></div><div id="quota"></div><div id="results"></div><div id="gadgets"></div><div id="heat"></div><div id="closing"></div><div id="hint"></div><div id="announce"></div>
<div id="coathud"><div id="heads"></div><div id="wobblebox"><div id="wobble"></div></div><div id="height"></div></div>
<script type="module" src="./main.js"></script>
</body>
</html>
